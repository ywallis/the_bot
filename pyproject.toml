[project]
name = "the-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"aiodns>=3.2.0",
	"aiohttp>=3.10.11",
	"aiosignal>=1.3.2",
	"attrs>=25.1.0",
	"ccxt>=4.5.77",
	"certifi>=2025.1.31",
	"cffi>=1.17.1",
	"charset-normalizer>=3.4.1",
	"cryptography>=44.0.1",
	"frozenlist>=1.5.0",
	"greenlet>=3.1.1",
	"hiredis>=3.0.0",
	"idna>=3.10",
	"multidict>=6.1.0",
	"mypy-extensions>=1.0.0",
	"mypy>=1.13.0",
	"numpy>=1.26.4",
	"pandas>=2.2.3",
	"psycopg>=3.2.3",
	"psycopg-binary>=3.2.3",
	"pycares>=4.5.0",
	"pycparser>=2.22",
	"python-dateutil>=2.9.0.post0",
	"python-dotenv>=1.0.1",
	"pytz>=2024.1",
	"pyzmq>=26.2.0",
	"redis>=5.2.0",
	"requests>=2.32.3",
	"setuptools>=75.8.0",
	"six>=1.16.0",
	"typing-extensions>=4.12.2",
	"tzdata>=2024.1",
	"urllib3>=2.3.0",
	"yarl>=1.18.3",
	"pytest>=8.3.4",
	"python-json-logger>=3.2.1",
	"aiohappyeyeballs>=2.4.6",
	"iniconfig>=2.0.0",
	"packaging>=24.2",
	"pluggy>=1.5.0",
	"propcache>=0.3.0",
	"pytest-asyncio>=0.25.3",
	"pytest-mock>=3.14.0",
	"protobuf>=5.29.5",
	"msgspec>=0.21.1",
]

[dependency-groups]
dev = [
	"fakeredis>=2.37.1",
	"ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/maker/src"]
testpaths = ["apps/maker/tests", "apps/shared/tests", "apps/strategies/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["D"]
ignore = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
