[project]
name = "the-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"aiodns>=3.2.0",
	"aiohttp>=3.10.11",
	"aiosignal>=1.3.2",
	"attrs>=25.1.0",
	"ccxt>=4.5.77",
	"certifi>=2025.1.31",
	"cffi>=1.17.1",
	"charset-normalizer>=3.4.1",
	"cryptography>=44.0.1",
	"frozenlist>=1.5.0",
	"greenlet>=3.1.1",
	"hiredis>=3.0.0",
	"idna>=3.10",
	"multidict>=6.1.0",
	"numpy>=1.26.4",
	"pandas>=2.2.3",
	"psycopg>=3.2.3",
	"psycopg-binary>=3.2.3",
	"pycares>=4.5.0",
	"pycparser>=2.22",
	"python-dateutil>=2.9.0.post0",
	"python-dotenv>=1.0.1",
	"pytz>=2024.1",
	"pyzmq>=26.2.0",
	"redis>=5.2.0",
	"requests>=2.32.3",
	"setuptools>=75.8.0",
	"six>=1.16.0",
	"typing-extensions>=4.12.2",
	"tzdata>=2024.1",
	"urllib3>=2.3.0",
	"yarl>=1.18.3",
	"pytest>=8.3.4",
	"python-json-logger>=3.2.1",
	"aiohappyeyeballs>=2.4.6",
	"iniconfig>=2.0.0",
	"packaging>=24.2",
	"pluggy>=1.5.0",
	"propcache>=0.3.0",
	"pytest-asyncio>=0.25.3",
	"pytest-mock>=3.14.0",
	"protobuf>=5.29.5",
	"msgspec>=0.21.1",
]

[dependency-groups]
dev = [
	"fakeredis>=2.37.1",
	"pytest-cov>=7.0.0",
	"ruff>=0.13.0",
	"ty>=0.0.79",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/maker/tests", "apps/shared/tests", "apps/strategies/tests"]
asyncio_default_fixture_loop_scope = "function"

# setup-uv reads this and installs the matching uv, so CI and a local run use
# the same resolver. Without it setup-uv falls back to "latest" and silently
# drifts ahead of whatever is on the developer machine.
[tool.uv]
required-version = ">=0.12.10"

[tool.ruff]
# apps/strategies is a separate private repository with its own lifecycle.
# Style there is its own business, and excluding it here means `ruff format`
# run from this repo cannot silently rewrite a submodule you did not intend to
# touch. Correctness is still shared: ty and pytest do cover it.
extend-exclude = ["apps/strategies"]

[tool.ruff.lint]
select = ["D"]
ignore = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.14"

# Test files are checked, but more loosely than src. Two things there are
# beyond what a checker can see: redis-py reply types are broad unions
# (`dict[bytes | str, bytes | str] | None` and friends) that tests index into
# directly, and test doubles are substituted for the real clients. Tightening
# this means typed reply helpers in conftest, not per-line suppressions.
[[tool.ty.overrides]]
include = ["apps/*/tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"

[tool.coverage.run]
branch = true
source = [
	"apps/accountant/src",
	"apps/maker/src",
	"apps/shared/src",
	"apps/strategies/src",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
# A ratchet, not a target: it is the level the suite actually reaches today.
# apps/accountant/src has no tests at all and is what holds this down; the
# other three trees sit around 79%. Raise this as coverage improves, and do
# not lower it to make a red build green.
fail_under = 64
